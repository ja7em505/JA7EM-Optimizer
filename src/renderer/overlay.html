<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Game Translator</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Segoe UI','Cairo',Tahoma,sans-serif;
      background:rgba(6,6,20,0.94);
      border-radius:10px; overflow:hidden;
      border:1px solid rgba(0,212,255,0.25);
      box-shadow:0 0 24px rgba(0,212,255,0.12);
      user-select:none;
    }
    .bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 10px; font-size:10px;
      background:linear-gradient(90deg,rgba(0,212,255,0.1),rgba(140,68,255,0.06));
      border-bottom:1px solid rgba(0,212,255,0.12);
      -webkit-app-region:drag;
    }
    .bar span { color:#00d4ff; font-weight:700; letter-spacing:1px; }
    .bar button {
      width:20px; height:20px; border:none; border-radius:5px;
      background:rgba(255,51,102,0.15); color:#ff3366;
      font-size:11px; cursor:pointer; -webkit-app-region:no-drag;
      display:flex; align-items:center; justify-content:center;
    }
    .bar button:hover { background:rgba(255,51,102,0.35); }
    .main {
      padding:12px; -webkit-app-region:no-drag;
      min-height:60px; display:flex; align-items:center;
    }
    .text {
      font-size:18px; font-weight:700; color:#e0e0ff;
      line-height:1.7; width:100%;
      text-shadow:0 0 6px rgba(0,212,255,0.2);
    }
    .text.waiting { color:#555; font-size:14px; font-weight:400; text-shadow:none; }
    .text.error { color:#ff3366; font-size:13px; font-weight:400; }
    .footer {
      display:flex; align-items:center; gap:6px;
      padding:5px 10px; font-size:9px; color:#00ff88;
      border-top:1px solid rgba(0,212,255,0.08);
    }
    .dot { width:6px; height:6px; border-radius:50%; background:#00ff88; box-shadow:0 0 6px rgba(0,255,136,0.6); }
    .dot.waiting { background:#ffaa00; box-shadow:0 0 6px rgba(255,170,0,0.6); }
    .dot.error { background:#ff3366; box-shadow:0 0 6px rgba(255,51,102,0.6); }
    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,#00d4ff,#8c44ff); border-radius:3px; }
  </style>
</head>
<body>
  <div class="bar">
    <span>TRANSLATOR</span>
    <button onclick="window.close()">&#10005;</button>
  </div>
  <div class="main">
    <div class="text waiting" id="text">Waiting for game text...</div>
  </div>
  <div class="footer">
    <div class="dot" id="dot"></div>
    <span id="status">Active</span>
  </div>
  <script>
    if (window.electronAPI && window.electronAPI.onTranslatorResult) {
      window.electronAPI.onTranslatorResult(function(d) {
        var t = document.getElementById('text');
        var dot = document.getElementById('dot');
        var st = document.getElementById('status');
        if (d.error) {
          t.textContent = d.error; t.className = 'text error';
          dot.className = 'dot error'; st.textContent = 'Error';
          return;
        }
        if (d.translated && d.translated.length > 2 && d.translated.indexOf('\u062A\u0631\u062C\u0645\u0629') === -1) {
          t.textContent = d.translated; t.className = 'text';
          dot.className = 'dot'; st.textContent = 'Live';
        } else {
          t.textContent = '\u064A\u0646\u062A\u0638\u0631 \u0627\u0644\u0646\u0635...';
          t.className = 'text waiting';
          dot.className = 'dot waiting'; st.textContent = 'Scanning...';
        }
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select Region</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width:100vw; height:100vh; overflow:hidden; cursor:crosshair;
      background:rgba(0,0,0,0.35);
    }
    canvas {
      position:absolute; top:0; left:0; width:100%; height:100%;
    }
    .hint {
      position:fixed; top:16px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.8); color:#fff; padding:10px 24px;
      border-radius:8px; font-family:'Segoe UI',sans-serif; font-size:14px;
      border:1px solid rgba(0,212,255,0.3); z-index:10; pointer-events:none;
    }
    .hint kbd {
      background:rgba(255,255,255,0.15); padding:2px 8px; border-radius:4px;
      margin:0 4px; font-family:monospace; font-size:13px;
    }
  </style>
</head>
<body>
  <div class="hint">Drag mouse to select region — Press <kbd>Esc</kbd> to cancel</div>
  <canvas id="c"></canvas>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let sx = 0, sy = 0, ex = 0, ey = 0, drawing = false;

    function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);

    c.addEventListener('mousedown', e => { sx = e.clientX; sy = e.clientY; drawing = true; });
    c.addEventListener('mousemove', e => {
      if (!drawing) return;
      ex = e.clientX; ey = e.clientY;
      ctx.clearRect(0,0,c.width,c.height);
      const x = Math.min(sx, ex), y = Math.min(sy, ey);
      const w = Math.abs(ex - sx), h = Math.abs(ey - sy);
      ctx.fillStyle = 'rgba(0,212,255,0.2)';
      ctx.fillRect(x, y, w, h);
    });
    c.addEventListener('mouseup', () => {
      if (!drawing) return;
      drawing = false;
      const region = {
        x: Math.round(Math.min(sx, ex)),
        y: Math.round(Math.min(sy, ey)),
        width: Math.round(Math.abs(ex - sx)),
        height: Math.round(Math.abs(ey - sy))
      };
      if (region.width < 30 || region.height < 20) return;
      try { window.electronAPI.regionSelected(region); } catch (e) {}
      window.close();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
